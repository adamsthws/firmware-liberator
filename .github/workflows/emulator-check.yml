# The tool's unit tests, then the firmware a conversion ends on, run on the
# emulator for each device a change could affect (tools/repo/emulator_check.py):
# each final firmware installed, then each device taken to the other. Nothing of
# Sonoff's is kept here, and no cloud: it runs on any runner, and a pull request
# from a fork runs it as it is. Its one secret, the emulator suites' service
# token, is given only to a run on main, which sends each conversion to the
# admin view's emulator figures (tools/repo/emulator_stats.py); without it the
# check is the same and sends nothing.
name: Final firmware on the emulator

on:
  # A branch's commits are tested by its pull request, not twice over.
  push:
    branches: [main]
    paths:
      - artifacts/firmware.json
      - artifacts/**
      - devices/**
      - tools/**
      - tests/**
      - .github/workflows/emulator-check.yml
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      every_device:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # On the portable Python start.sh and tools/windows-python.ps1 install where
  # there is no other - what most conversions run on (tests/repo/test_release.py
  # keeps the two the same).
  unit:
    name: unit (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12.10"
      - name: Unit tests
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON" -m venv .venv
          .venv/bin/pip install -q --require-hashes --no-deps -r requirements/ci.txt
          status=0
          PYTHONUNBUFFERED=1 .venv/bin/python -m coverage run --branch --source=tools \
              -m unittest discover -s tests > unit.txt 2>&1 || status=$?
          # Each failure with its traceback, then the count; the whole is kept below.
          awk '/^(FAIL|ERROR): /{show=1} /^Ran [0-9]+ tests/{show=1} show' unit.txt | tail -400
          grep -E "^(Ran [0-9]+ tests|OK|FAILED)" unit.txt >> "$GITHUB_STEP_SUMMARY" || true
          # What of tools/ they run, to see what they miss: a report, not a gate.
          # --branch counts each way an if can go, not only each line.
          {
            echo
            echo "The unit tests run $(.venv/bin/python -m coverage report --format=total)% of the lines and branches in tools/."
            echo
            echo "<details><summary>By file, least first</summary>"
            echo
            .venv/bin/python -m coverage report --format=markdown --sort=cover
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit $status
      - name: Keep the unit tests' output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-tests
          path: unit.txt
          retention-days: 30

  # The same on the oldest Python the tool runs on, 3.10: what a Mac's own
  # Python may be, or one already installed where the portable Python cannot
  # be had (start.sh, windows-python.ps1). Beside the job above, so no longer
  # to wait for.
  unit-oldest-python:
    name: unit (Python 3.10)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.10"
      # Every Python file, test or not: compiled by 3.10, whose limits newer
      # Pythons have lifted (tools/repo/lint.py).
      - name: Compile
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: '"$PYTHON" tools/repo/lint.py compile'
      - name: Unit tests
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON" -m venv .venv
          .venv/bin/pip install -q --require-hashes --no-deps -r requirements/ci.txt
          status=0
          PYTHONUNBUFFERED=1 .venv/bin/python -m unittest discover -s tests > unit.txt 2>&1 || status=$?
          awk '/^(FAIL|ERROR): /{show=1} /^Ran [0-9]+ tests/{show=1} show' unit.txt | tail -400
          grep -E "^(Ran [0-9]+ tests|OK|FAILED)" unit.txt >> "$GITHUB_STEP_SUMMARY" || true
          exit $status
      - name: Keep the unit tests' output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-tests-python-3.10
          path: unit.txt
          retention-days: 30

  # Which devices: every one, by hand or for a release, or those this change
  # could affect.
  devices:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.list.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # what changed since the base
          persist-credentials: false
      - id: list
        env:
          EVERY: ${{ inputs.every_device || github.event_name == 'workflow_dispatch' }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          since=(--changed-since "$BASE")
          [ "$EVERY" != true ] && [ -n "$BASE" ] || since=()
          echo "jobs=$(python3 -I tools/repo/emulator_check.py list "${since[@]}")" >> "$GITHUB_OUTPUT"

  device:
    needs: devices
    if: ${{ needs.devices.outputs.jobs != '[]' }}
    name: emulator (${{ matrix.device }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read   # whether its image's workflow is building the image
    strategy:
      fail-fast: false   # each device's result says something of its own
      matrix:
        include: ${{ fromJSON(needs.devices.outputs.jobs) }}
    env:
      DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The emulator's tools
        run: |
          command -v rsync >/dev/null || sudo apt-get install -y -q rsync
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes --no-deps -r requirements/ci.txt
      - name: The emulator image, once its workflow has published it
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          IMAGE_WORKFLOW: ${{ matrix.image_workflow }}
          IMAGE_TAG: ${{ matrix.image_tag }}
          IMAGE_NAME: ${{ matrix.image_name }}
          PUBLISHED_VARIABLE: ${{ matrix.published_variable }}
        run: |
          # A push that changes what the image is built from starts its workflow
          # beside this one: wait for the image it publishes rather than build the
          # same one here, as the emulator does when none is published. The one
          # waited for is the one the emulator pulls.
          published="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME"
          echo "$PUBLISHED_VARIABLE=$published" >> "$GITHUB_ENV"
          image="$published:$($IMAGE_TAG)"
          echo "Emulator image: $image"
          for _ in $(seq 60); do
              if docker manifest inspect "$image" >/dev/null 2>&1; then
                  echo "Published."; exit 0
              fi
              building=$(gh run list --workflow "$IMAGE_WORKFLOW" --commit "$COMMIT" --json status \
                  --jq '[.[] | select(.status != "completed")] | length')
              if [ "$building" = 0 ]; then
                  echo "Not published, nor being built: the emulator builds it here."; exit 0
              fi
              echo "Its workflow is building it: waiting..."
              sleep 20
          done
          echo "Still not published after 20 minutes: the emulator builds it here."
      - name: Its final firmware
        env:
          EMULATOR_STATS_CLIENT_ID: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.EMULATOR_STATS_CLIENT_ID || '' }}
          EMULATOR_STATS_CLIENT_SECRET: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.EMULATOR_STATS_CLIENT_SECRET || '' }}
        run: |
          set -o pipefail
          .venv/bin/python -I tools/repo/emulator_check.py "$DEVICE" | tee test.txt
          {
            echo "### $DEVICE's final firmware on the emulator"
            echo
            echo '```'
            cat test.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-logs-${{ matrix.device }}
          path: |
            captures/emulation/public-devices/
            captures/emulation/device-check/
            captures/emulation/state-*/work/captures/devices/*/runs/*/run.log
          if-no-files-found: ignore
          retention-days: 30

  # The check main requires: every device's job passed, or none was needed.
  emulator:
    needs: [devices, device]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          DEVICES: ${{ needs.devices.result }}
          DEVICE: ${{ needs.device.result }}
        run: |
          echo "Which devices: $DEVICES; their checks: $DEVICE"
          [ "$DEVICES" = success ] && { [ "$DEVICE" = success ] || [ "$DEVICE" = skipped ]; }
