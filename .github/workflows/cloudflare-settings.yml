# The website's Cloudflare settings, as tools/repo/cloudflare_settings.py
# says - the zone, its redirect and rate-limiting rule, and the readouts
# bucket with its lifecycle rule - checked, never set: weekly, and on each
# push to main that changes them. A run fails on any difference, whether a
# change made in the dashboard or one written down there and not applied
# yet. Settings are applied by hand, with a short-lived token
# (website/README.md); this job's token can read and nothing else.
name: Cloudflare settings

on:
  push:
    branches: [main]
    paths:
      - tools/repo/cloudflare_settings.py
      - .github/workflows/cloudflare-settings.yml
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: cloudflare-settings

jobs:
  settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: website
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: What differs from what is written down
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
        run: python3 tools/repo/cloudflare_settings.py
