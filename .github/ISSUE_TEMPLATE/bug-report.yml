name: A conversion went wrong
description: A run that stopped, failed or left the device in a state it should not be in.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting it. [docs/troubleshooting.md](https://github.com/adamsthws/firmware-liberator/blob/main/docs/troubleshooting.md) covers what has happened before - worth a look first.

        A run that **worked** needs nothing more: its report tells the project how it went ([what the tool sends](https://firmwareliberator.com/docs/what-the-tool-sends)).
  - type: input
    id: report
    attributes:
      label: The report's ID
      description: Filled in when you open this from the link the tool shows, and on the report it shows. It lets the maintainer find this run's report, which says nothing about you.
  - type: textarea
    id: run_report
    attributes:
      label: The run's report
      description: The report the tool showed at the end of the run, copied from the screen.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what the screen said, and where it stopped.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: The computer it ran on
      options:
        - Linux
        - macOS
        - Windows
        - Something else (say above)
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: The device
      options:
        - Sonoff S60
        - Sonoff S61
        - Something else (say above)
    validations:
      required: true
  - type: dropdown
    id: firmware
    attributes:
      label: The firmware it was converting to
      options:
        - Tasmota
        - ESPHome
        - OpenBeken
        - Sonoff's own firmware (going back)
        - It had not asked yet
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The run's log
      description: |
        Drag `run.log` in here: the tool prints where it is, and its first line says the tool's version. It is safe to share - your account, network and device are written in it as `<email>`, `<wifi-name>`, `<device-id>` and so on. **Its folder's name is your device's MAC address**: attach the file, but do not paste its path.
  - type: checkboxes
    id: private
    attributes:
      label: Nothing private
      options:
        - label: I have not pasted my eWeLink login, my Wi-Fi's name or password, or my device's MAC address here.
          required: true
