[platformio]
default_envs = autoflash-bridge
src_dir = main

[env:autoflash-bridge]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -Werror=return-type

; The same bridge for a plug with a classic ESP32 (tools/repo/update_firmware.py
; esp32-bridge publishes it).
[env:autoflash-bridge-esp32]
extends = env:autoflash-bridge
board = esp32dev

; Research build: adds a read-only GET /nvs that streams the stock NVS
; partition. Never shipped as the conversion bridge.
[env:autoflash-bridge-nvs-probe]
extends = env:autoflash-bridge
build_flags =
    ${env:autoflash-bridge.build_flags}
    -DBRIDGE_NVS_READOUT

