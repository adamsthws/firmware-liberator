# ESPHome for the Sonoff Dual R3.
#
# The conversion tool installs this pre-built (artifacts/README.md says how it
# is built), with no Wi-Fi and no passwords in it: it writes the device's own
# Wi-Fi into the two placeholders in devices/shared-esphome/wifi-esp32.yaml
# (tools/autoflash/imprint.py). What every device has is in
# devices/shared-esphome/, which Home Assistant fetches with this config when it
# adopts the device (dashboard_import) and builds it there.
#
# Its pins are as published (devices/sonoff-dualr3/README.md says where). It has run in
# the emulator only, which has no relay or other hardware to see.

esphome:
  # Named as every firmware the conversion installs is, whatever the device.
  name: esphome
  friendly_name: esphome
  comment: Sonoff-DUALR3
  name_add_mac_suffix: true
  project:
    name: liberator.sonoff-dualr3
    version: "2026.10.0-3"
  on_boot:
    # Tasmota holds its output pins through a software restart, and the install
    # ends with one: release them before anything drives them.
    - priority: 1000
      then:
        - lambda: |-
            gpio_hold_dis(GPIO_NUM_27);
            gpio_hold_dis(GPIO_NUM_14);
            gpio_hold_dis(GPIO_NUM_13);

# Adopting the device in Home Assistant's ESPHome builder takes this config as
# a package. update_firmware.py writes the release.
dashboard_import:
  package_import_url: github://adamsthws/firmware-liberator/devices/sonoff-dualr3/esphome.yaml@v3.1.0
  import_full_config: false

esp32:
  variant: esp32
  framework:
    type: esp-idf
  flash_size: 4MB

# The serial port's pins are not the meter's, but its log is of no use on a
# device whose case is not opened.
logger:
  baud_rate: 0

uart:
  tx_pin: GPIO25
  rx_pin: GPIO26
  baud_rate: 38400
  parity: EVEN
  stop_bits: 1

status_led:
  pin:
    number: GPIO13
    inverted: true

# What every device has (devices/shared-esphome/README.md), then this one's own.
packages:
  base: !include ../shared-esphome/base.yaml
  wifi: !include ../shared-esphome/wifi-esp32.yaml
  relay: !include {file: ../shared-esphome/relay.yaml, vars: {relay: relay, name: "Relay", default: "false", countdown: "Countdown"}}
  relay_2: !include {file: ../shared-esphome/relay.yaml, vars: {relay: relay_2, name: "Relay 2", default: "false", countdown: "Countdown 2"}}
  energy_1: !include {file: ../shared-esphome/energy-totals.yaml, vars: {energy: energy_1, id_end: "_1", name_end: " 1"}}
  energy_2: !include {file: ../shared-esphome/energy-totals.yaml, vars: {energy: energy_2, id_end: "_2", name_end: " 2"}}
  # Each channel's relay is rated 10 A, 2200 W; the two 15 A, 3300 W together.
  overload_1: !include {file: ../shared-esphome/overload.yaml, vars: {relay: relay, power: power_1, id_end: "_1", name_end: " 1", max: "2200", default: "2200"}}
  overload_2: !include {file: ../shared-esphome/overload.yaml, vars: {relay: relay_2, power: power_2, id_end: "_2", name_end: " 2", max: "2200", default: "2200"}}

switch:
  - id: relay
    platform: gpio
    name: "Relay"
    pin: GPIO27
  - id: relay_2
    platform: gpio
    name: "Relay 2"
    pin: GPIO14

binary_sensor:
  - platform: gpio
    id: button_1
    internal: true
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - switch.toggle: relay
  - platform: gpio
    id: wall_switch_1
    internal: true
    pin:
      number: GPIO32
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_state:
      - switch.toggle: relay
  - platform: gpio
    id: wall_switch_2
    internal: true
    pin:
      number: GPIO33
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_state:
      - switch.toggle: relay_2

sensor:
  # Units since September 2021 have a BL0930 instead, which this does not read.
  - platform: cse7761
    update_interval: 5s
    voltage:
      name: "Voltage"
    current_1:
      name: "Current 1"
    current_2:
      name: "Current 2"
    active_power_1:
      name: "Power 1"
      id: power_1
    active_power_2:
      name: "Power 2"
      id: power_2

  # Energy since boot (Wh), from the power: its meter gives none of its own.
  - platform: integration
    name: "Energy 1"
    id: energy_1
    sensor: power_1
    time_unit: h
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing
    restore: false

  - platform: integration
    name: "Energy 2"
    id: energy_2
    sensor: power_2
    time_unit: h
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing
    restore: false

