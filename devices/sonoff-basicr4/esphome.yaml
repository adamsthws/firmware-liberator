# ESPHome for the Sonoff BASICR4.
#
# The conversion tool installs this pre-built (artifacts/README.md says how it
# is built), with no Wi-Fi and no passwords in it: it writes the device's own
# Wi-Fi into the two placeholders in devices/shared-esphome/wifi-esp32.yaml
# (tools/autoflash/imprint.py). What every device has is in
# devices/shared-esphome/, which Home Assistant fetches with this config when it
# adopts the device (dashboard_import) and builds it there.
#
# Its pins are as published (devices/sonoff-basicr4/README.md says
# where). Nobody has checked them on a real one, and the emulator cannot: it has
# no relay or other hardware to see. GPIO5 is left alone: a zero-cross detector
# drives it, for Sonoff's Magic Switch, and nothing here may drive it back.

esphome:
  # Named as every firmware the conversion installs is, whatever the device.
  name: esphome
  friendly_name: esphome
  comment: Sonoff-BASICR4
  name_add_mac_suffix: true
  project:
    name: liberator.sonoff-basicr4
    version: "2026.10.0-2"
  on_boot:
    # Tasmota holds its output pins through a software restart, and the install
    # ends with one: release them before anything drives them.
    - priority: 1000
      then:
        - lambda: |-
            gpio_hold_dis(GPIO_NUM_4);
            gpio_hold_dis(GPIO_NUM_6);

# Adopting the device in Home Assistant's ESPHome builder takes this config as
# a package. update_firmware.py writes the release.
dashboard_import:
  package_import_url: github://adamsthws/firmware-liberator/devices/sonoff-basicr4/esphome.yaml@v3.2.0
  import_full_config: false

esp32:
  variant: esp32c3
  framework:
    type: esp-idf
  flash_size: 4MB

# Its serial port sits at mains potential, and its log is of no use on a device
# whose case is not opened.
logger:
  baud_rate: 0

# As the Tasmota template has it (544, LedLink, not inverted). ESPHome's device
# page has it inverted: which is right is not known, and only the LED differs.
status_led:
  pin:
    number: GPIO6
    inverted: false

# What every device has (devices/shared-esphome/README.md), then this one's own.
packages:
  base: !include ../shared-esphome/base.yaml
  wifi: !include ../shared-esphome/wifi-esp32.yaml
  relay: !include {file: ../shared-esphome/relay.yaml, vars: {relay: relay, name: "Relay", default: "false", countdown: "Countdown"}}

switch:
  - id: relay
    platform: gpio
    name: "Relay"
    pin: GPIO4

binary_sensor:
  - platform: gpio
    id: button_1
    internal: true
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - switch.toggle: relay

