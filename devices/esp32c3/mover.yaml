# The mover: a small ESPHome the conversion tool runs for a minute or two,
# only to change which memory layout a device has. Not something to keep on a
# device, and not for Home Assistant.
#
# Leaving Tasmota, the device is on Tasmota's layout, and its running Tasmota
# sits across both of the app slots Sonoff's layout has, so nothing it runs
# can write into either. This is small enough to go in front of it, at
# 0x20000, Sonoff's first slot: the tool writes it there, with Sonoff's
# layout last, and the device starts it. The tool then sends what comes next as
# an ordinary update.
#
# Like the ESPHome images the tool installs, it is published pre-built with
# Wi-Fi placeholders the tool writes the device's Wi-Fi into; it saves nothing,
# as it never stays. It is the same for any device with an ESP32-C3 and 4 MB of
# flash: it drives no pins.

esphome:
  # Sixteen characters: with ESPHome's suffix of the MAC (a dash and six) it is
  # as long as the name the mover goes by, which on_boot writes over it.
  name: autoflash-moving
  name_add_mac_suffix: true
  project:
    name: liberator.mover
    version: "1.2.0"
  # GET /mover, so the tool knows the mover, and POST /restart, so it can
  # restart one that still answers (devices/mover_routes.h).
  includes:
    - ../mover_routes.h
  on_boot:
    # Before Wi-Fi starts (its priority is 250): the network to join, and the
    # mover's name. Joined from that for as long as it takes - a router
    # restarting meanwhile, say - and nothing saved, as the mover never stays.
    - priority: 1000
      then:
        - lambda: |-
            static const char ssid[] = "AUTOFLASH-IMPRINT-SSID>.................................";
            static const char password[] = "AUTOFLASH-IMPRINT-PASS>................................................................";
            const char *volatile at_ssid = ssid;
            const char *volatile at_password = password;
            id(imprinted_ssid) = at_ssid;
            id(imprinted_password) = at_password;
            if (!id(imprinted_ssid).empty() && id(imprinted_ssid).rfind("AUTOFLASH-IMPRINT-", 0) != 0) {
              wifi::WiFiAP sta;
              sta.set_ssid(id(imprinted_ssid));
              sta.set_password(id(imprinted_password));
              wifi::global_wifi_component->set_sta(sta);
            }
            // The name every firmware of the conversion goes by, on the home
            // network and as its own network (open): autoflash-recovery- and
            // the last two bytes of the device's Wi-Fi MAC. Written over
            // ESPHome's own name, which is as long, so Wi-Fi gives it as the
            // hostname too.
            uint8_t mac[6];
            get_mac_address_raw(mac);
            char *name = const_cast<char *>(App.get_name().c_str());
            snprintf(name, App.get_name().size() + 1, "autoflash-recovery-%02X%02X", mac[4], mac[5]);
            wifi::WiFiAP ap;
            ap.set_ssid(name);
            wifi::global_wifi_component->set_ap(ap);
    # After Wi-Fi's setup (250), so the network is there for the routes.
    - priority: -100
      then:
        - lambda: autoflash::start_routes();

globals:
  - id: imprinted_ssid
    type: std::string
  - id: imprinted_password
    type: std::string

esp32:
  variant: esp32c3
  framework:
    type: esp-idf
  flash_size: 4MB

wifi:
  reboot_timeout: 0s
  # Two minutes away from the home network, and it raises its own, where the
  # captive portal's page takes new Wi-Fi details - the home network changed
  # since the device last joined it, say - while it goes on trying the home one.
  # Without it a mover that cannot join is a device only a serial cable reaches.
  ap:
    ap_timeout: 2min

captive_portal:

# Not needed - the tool finds the mover by its address and its update service -
# and leaving it out keeps the mover small enough to go in front of Tasmota.
mdns:
  disabled: true

ota:
  - platform: esphome
