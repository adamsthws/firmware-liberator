# ESPHome for the Sonoff POW Ring (POWCT).
#
# The conversion tool installs this pre-built (artifacts/README.md says how it
# is built), with no Wi-Fi and no passwords in it: it writes the device's own
# Wi-Fi into the two placeholders in devices/shared-esphome/wifi-esp32.yaml
# (tools/autoflash/imprint.py). What every device has is in
# devices/shared-esphome/, which Home Assistant fetches with this config when it
# adopts the device (dashboard_import) and builds it there.
#
# Its pins are as published (devices/sonoff-powct/README.md says where). It has run in
# the emulator only, which has no relay or other hardware to see.

esphome:
  # Named as every firmware the conversion installs is, whatever the device.
  name: esphome
  friendly_name: esphome
  comment: Sonoff-POWCT
  name_add_mac_suffix: true
  project:
    name: liberator.sonoff-powct
    version: "2026.10.0-4"
  on_boot:
    # Tasmota holds its output pins through a software restart, and the install
    # ends with one: release them before anything drives them.
    - priority: 1000
      then:
        - lambda: |-
            gpio_hold_dis(GPIO_NUM_21);
            gpio_hold_dis(GPIO_NUM_13);
            gpio_hold_dis(GPIO_NUM_15);

# Adopting the device in Home Assistant's ESPHome builder takes this config as
# a package. update_firmware.py writes the release.
dashboard_import:
  package_import_url: github://adamsthws/firmware-liberator/devices/sonoff-powct/esphome.yaml@v3.1.0
  import_full_config: false

esp32:
  variant: esp32
  framework:
    type: esp-idf
  flash_size: 4MB

# The serial port's pins are not the meter's, but its log is of no use on a
# device whose case is not opened.
logger:
  baud_rate: 0

uart:
  tx_pin: GPIO26
  rx_pin: GPIO25
  baud_rate: 38400
  parity: EVEN
  stop_bits: 1

status_led:
  pin:
    number: GPIO15
    inverted: true

# What every device has (devices/shared-esphome/README.md), then this one's own.
packages:
  base: !include ../shared-esphome/base.yaml
  wifi: !include ../shared-esphome/wifi-esp32.yaml
  relay: !include {file: ../shared-esphome/relay.yaml, vars: {relay: relay, name: "Relay", default: "false", countdown: "Countdown"}}
  # Its clamp measures a circuit of its own, not the relay's load: no overload.yaml.
  energy: !include {file: ../shared-esphome/energy-totals.yaml, vars: {energy: energy, id_end: "", name_end: ""}}
  # Of the clamp's circuit, as its power is: the mains voltage it measures is
  # that circuit's too.
  derived: !include {file: ../shared-esphome/derived-power.yaml, vars: {voltage: voltage, current: current, power: power, id_end: "", name_end: ""}}

switch:
  - id: relay
    platform: gpio
    name: "Relay"
    pin: GPIO21
    on_turn_on:
      - output.turn_on: relay_led
    on_turn_off:
      - output.turn_off: relay_led

output:
  - platform: gpio
    id: relay_led
    # Lit when high, as Sonoff's firmware drives it (README.md).
    pin: GPIO13

display:
  platform: tm1621
  id: tm1621_display
  cs_pin: GPIO17
  data_pin: GPIO5
  read_pin: GPIO23
  write_pin: GPIO18
  lambda: |-
    it.display_voltage(true);
    it.printf(0, "%.1f", id(voltage).state);
    it.printf(1, "%.1f", id(power).state);

binary_sensor:
  - platform: gpio
    id: button_1
    internal: true
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - switch.toggle: relay

sensor:
  - platform: cse7761
    update_interval: 2s
    current_1:
      name: "Current"
      id: current
      filters:
        # ESPHome's page for this device: the clamp reads pi times too much.
        - lambda: return x / M_PI;
    voltage:
      name: "Voltage"
      id: voltage
    active_power_1:
      name: "Power"
      id: power
      filters:
        - lambda: return x / M_PI;

  # Energy since boot (Wh), from the power: its meter gives none of its own.
  - platform: integration
    name: "Energy"
    id: energy
    sensor: power
    time_unit: h
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing
    restore: false

