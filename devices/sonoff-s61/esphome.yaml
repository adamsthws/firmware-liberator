# ESPHome for the Sonoff S61 (BK7238; EU S61TPF and the S61 variants on the same
# WBBK_01P board), on LibreTiny.
#
# The conversion tool installs this pre-built, as an rt_ota update (.rbl) the
# device's stock bootloader applies from its download slot - the update format
# the stock firmware itself is shipped in (docs/beken-research.md). No Wi-Fi and
# no passwords are in it: at boot the device reads its own Wi-Fi from where the
# stock firmware left it, the EasyFlash store at 0x3e2000 that no conversion
# touches, and joins. The tool backs the device up before this goes on, through
# the interim firmware, so nothing here reads the device out. What every device
# has is in devices/shared-esphome/, which Home Assistant fetches with this
# config when it adopts the device (dashboard_import) and builds it there.
#
# The S60's config (sonoff_s60.yaml) is the model: the same entities, actions,
# calibration handling and energy totals, so the two devices look alike.

esphome:
  # Named as every firmware the conversion installs is, whatever the device:
  # the firmware and the last three bytes of its MAC (esphome-abcdef), its
  # own network too; ESPHome adds them to the friendly name with a space
  # (esphome abcdef). The comment says what device it is, which the tool tells
  # it by - one for every model of the S61.
  name: esphome
  friendly_name: esphome
  comment: Sonoff-S61
  name_add_mac_suffix: true
  project:
    name: liberator.sonoff-s61
    version: "2026.10.0-4"
  # The S61's 4 MB flash, laid out as its stock bootloader expects (LibreTiny's
  # generic BK7238 board is the SDK's 2 MB layout). The bootloader's partition
  # table: app 0x10000+0x250000 (0x11000+0x275000 with its CRC stripes),
  # download 0x286000+0x15A000 - where the stock bootloader applies an update
  # from, so ESPHome's own updates go through it too. Above that the device's own
  # data: the factory store with the radio calibration at 0x3e0000, the stock
  # EasyFlash store (Wi-Fi, meter trim, identity) at 0x3e2000, which stays as
  # it is so the device can always go back to stock. ESPHome's preferences take
  # the empty 32 KB at 0x3ee000; LittleFS (unused) the sector at 0x3e1000,
  # where the interim firmware left its settings.
  platformio_options:
    board_build.bkrbl_size_app: "0x250000"
    board_flash.bootloader: "0x000000+0x11000"
    board_flash.app: "0x011000+0x275000"
    board_flash.download: "0x286000+0x15A000"
    board_flash.calibration: "0x3E0000+0x1000"
    board_flash.userdata: "0x3E1000+0x1000"
    board_flash.kvs: "0x3EE000+0x8000"
  on_boot:
    # Before the meter is read: its factory calibration, from the stock
    # store (devices/shared-esphome/ef40.h).
    - priority: 1000
      then:
        - lambda: |-
            // The factory meter calibration, elecCalibCoef (80 bytes): a u32
            // magic, a flag byte, padding, then three 24-byte records in the
            // order current, voltage, power, each beginning with int32 a, b, c.
            std::string coef;
            if (autoflash::ef40_read("elecCalibCoef", coef) && coef.size() >= 8 + 3 * 24) {
              for (int i = 0; i < 3; i++) {
                int32_t abc[3];
                memcpy(abc, coef.data() + 8 + 24 * i, sizeof(abc));
                for (int j = 0; j < 3; j++) id(calibration_stock)[3 * i + j] = abc[j];
              }
              id(calibration_stock_found) = true;
            }
    # After globals are restored (800), before the meter is read: the device's
    # factory calibration, as the stock firmware applies it.
    - priority: 600
      then:
        - lambda: |-
            // Else the one the conversion tool gave from the device's Sonoff
            // backup (autoflash_calibration), once the stock store has none.
            const char *source;
            if (id(calibration_stock_found)) {
              id(calibration) = id(calibration_stock);
              source = "stock store";
            } else if (id(calibration_given)) {
              id(calibration) = id(calibration_from_backup);
              source = "from backup";
            } else {
              source = "missing";
            }
            id(calibration_status) = source;
            ESP_LOGI("s61", "Calibration: %s", source);
            if (!id(start_ssid).empty()) {
              ESP_LOGI("s61", "Wi-Fi from the stock store: '%s' (%d-char password)", id(start_ssid).c_str(),
                       (int) id(start_password).size());
            } else {
              ESP_LOGI("s61", "No Wi-Fi in the stock store");
            }

# Adopting the device in Home Assistant's ESPHome builder takes this config as
# a package: the device's own config names it, with the device's name, API key
# and Wi-Fi. It names the release this image came out in, which cannot change,
# so nothing of ours reaches an adopted device until its owner names a newer one.
# update_firmware.py writes the release.
dashboard_import:
  package_import_url: github://adamsthws/firmware-liberator/devices/sonoff-s61/esphome.yaml@v3.1.0
  import_full_config: false

globals:
  # Power (W) of the last meter reading, before calibration
  - id: raw_power
    type: float
    initial_value: "0.0"
  # [a, b, c] for current, voltage and power: the stock firmware's trim
  # a*x^2/1e7 + b*x/1e6 + c/1e6 on a reading x in A, V or W. Uncalibrated
  # until read at boot from the stock store, or from what the conversion tool
  # gave.
  - id: calibration
    type: std::array<double, 9>
    initial_value: "{0, 1e6, 0, 0, 1e6, 0, 0, 1e6, 0}"
  - id: calibration_stock
    type: std::array<double, 9>
    initial_value: "{0, 1e6, 0, 0, 1e6, 0, 0, 1e6, 0}"
  - id: calibration_stock_found
    type: bool
    initial_value: "false"
  - id: calibration_status
    type: std::string
    initial_value: '"unknown"'
  # The factory calibration the conversion tool gave from the device's Sonoff
  # backup, for a device whose stock store no longer has it.
  - id: calibration_from_backup
    type: std::array<double, 9>
    restore_value: true
    initial_value: "{0, 1e6, 0, 0, 1e6, 0, 0, 1e6, 0}"
  - id: calibration_given
    type: bool
    restore_value: true
    initial_value: "false"
bk72xx:
  board: generic-bk7238
  framework:
    version: recommended

api:
  actions:
    # The device's factory calibration (a, b, c for current, voltage and power,
    # as the stock firmware stores it), which the conversion tool gives from
    # the device's Sonoff backup: saved, and used when the stock store has none.
    # The tool then reads the Calibration sensor.
    - action: autoflash_calibration
      variables:
        coefficients: float[]
      then:
        - lambda: |-
            if (coefficients.size() == 9) {
              std::copy(coefficients.begin(), coefficients.end(), id(calibration_from_backup).begin());
              id(calibration_given) = true;
              if (!id(calibration_stock_found)) {
                id(calibration) = id(calibration_from_backup);
                id(calibration_status) = "from backup";
              }
            }
        - component.update: calibration_sensor
        # Written to flash now, once the globals have saved themselves (each
        # loop), not up to a minute later: unplugged in that minute, the device
        # would forget it.
        - delay: 1s
        - lambda: global_preferences->sync();

# The Wi-Fi LED, lit low
status_led:
  pin:
    number: P1
    inverted: true

# The relay LED, lit low, follows the relay
output:
  - platform: gpio
    id: relay_led
    pin:
      number: P0
      inverted: true

# What every device has (devices/shared-esphome/README.md), then this one's own.
packages:
  base: !include ../shared-esphome/base.yaml
  wifi: !include ../shared-esphome/wifi-bk72xx.yaml
  relay: !include {file: ../shared-esphome/relay.yaml, vars: {relay: relay, name: "Relay", default: "true", countdown: "Countdown"}}
  energy: !include {file: ../shared-esphome/energy-totals.yaml, vars: {energy: energy, id_end: "", name_end: ""}}
  overload: !include {file: ../shared-esphome/overload.yaml, vars: {relay: relay, power: power, id_end: "", name_end: "", max: "4000", default: "3500"}}

switch:
  - id: relay
    platform: gpio
    name: "Relay"
    pin: P26
    on_turn_on:
      - output.turn_on: relay_led
    on_turn_off:
      - output.turn_off: relay_led

binary_sensor:
  - platform: gpio
    id: button_1
    internal: true
    pin:
      number: P9
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
text_sensor:
  # Where the calibration came from: stock store, from backup or missing
  - platform: template
    name: "Calibration"
    id: calibration_sensor
    entity_category: diagnostic
    lambda: return id(calibration_status);
    update_interval: 60s

sensor:
  # The BL0937 meter, on the pins the stock firmware drives: CF (power pulses)
  # P8, CF1 (current or voltage pulses, as SEL says) P6, SEL P24, a 1 mΩ shunt
  # and a 2040:1 divider. Calibrated as the stock firmware does: it reckons
  # the pulse rate with a reference of 1.1 V where the BL0937 datasheet (and
  # ESPHome) say 1.218 V, then applies the factory trim a*x^2/1e7 + b*x/1e6 +
  # c/1e6 to a reading x in A, V or W. A BL0937 measures the voltage with SEL
  # high, where hlw8012 drives it high for the current (an HLW8012's sense),
  # so SEL is inverted, as ESPHome's page says for this model.
  - platform: hlw8012
    model: BL0937
    sel_pin:
      number: P24
      inverted: true
    cf_pin: P8
    cf1_pin: P6
    current_resistor: 0.001
    voltage_divider: 2040
    update_interval: 2s
    change_mode_every: 1
    current:
      name: "Current"
      filters:
        - lambda: |-
            const auto &c = id(calibration);
            x *= 1.1f / 1.218f;
            return c[0] * x * x / 1e7 + c[1] * x / 1e6 + c[2] / 1e6;
    voltage:
      name: "Voltage"
      filters:
        - lambda: |-
            const auto &c = id(calibration);
            x *= 1.1f / 1.218f;
            return c[3] * x * x / 1e7 + c[4] * x / 1e6 + c[5] / 1e6;
    power:
      name: "Power"
      id: power
      filters:
        - lambda: |-
            const auto &c = id(calibration);
            x *= (1.1f / 1.218f) * (1.1f / 1.218f);
            id(raw_power) = x;
            float y = c[6] * x * x / 1e7 + c[7] * x / 1e6 + c[8] / 1e6;
            return y < 0.0f ? 0.0f : y;
    # Energy since boot (Wh), from the meter's own pulses, which stay right at
    # loads too small for the power reading. Each increase is calibrated as
    # the power it was drawn at; the energy totals add each
    # (devices/shared-esphome/energy-totals.yaml).
    energy:
      name: "Energy"
      id: energy
      filters:
        - lambda: |-
            static float last = NAN;
            static double since_boot = 0;
            x *= (1.1f / 1.218f) * (1.1f / 1.218f);
            if (!std::isnan(last) && x > last) {
              const auto &c = id(calibration);
              float p = id(raw_power);
              double scale = 1.0;
              if (p > 0.0f) scale = std::max(0.0, c[6] * p * p / 1e7 + c[7] * p / 1e6 + c[8] / 1e6) / p;
              double wh = (x - last) * scale;
              since_boot += wh;
            }
            last = x;
            return (float) since_boot;
        - throttle: 5s

