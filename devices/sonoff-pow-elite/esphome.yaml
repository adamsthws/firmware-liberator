# ESPHome for the Sonoff POW Elite 16A (POWR316D). Not the 20 A POWR320D, whose
# relay is a latching one on other pins.
#
# The conversion tool installs this pre-built (artifacts/README.md says how it
# is built), with no Wi-Fi and no passwords in it: it writes the device's own
# Wi-Fi into the two placeholders in devices/shared-esphome/wifi-esp32.yaml
# (tools/autoflash/imprint.py). What every device has is in
# devices/shared-esphome/, which Home Assistant fetches with this config when it
# adopts the device (dashboard_import) and builds it there.
#
# Its pins are ESPHome's and Blakadder's published ones, which agree. It has run
# in the emulator only, which has no relay, meter or display to see.

esphome:
  # Named as every firmware the conversion installs is, whatever the device.
  name: esphome
  friendly_name: esphome
  comment: Sonoff-POWR316D
  name_add_mac_suffix: true
  project:
    name: liberator.sonoff-pow-elite
    version: "2026.10.0-4"
  on_boot:
    # Tasmota holds its output pins through a software restart, and the install
    # ends with one: release them before anything drives them.
    - priority: 1000
      then:
        - lambda: |-
            gpio_hold_dis(GPIO_NUM_13);
            gpio_hold_dis(GPIO_NUM_5);
            gpio_hold_dis(GPIO_NUM_18);

# Adopting the device in Home Assistant's ESPHome builder takes this config as
# a package. update_firmware.py writes the release.
dashboard_import:
  package_import_url: github://adamsthws/firmware-liberator/devices/sonoff-pow-elite/esphome.yaml@v3.2.0
  import_full_config: false

esp32:
  variant: esp32
  framework:
    type: esp-idf
  flash_size: 4MB

# The serial port's pins are not the meter's, but its log is of no use on a
# device whose case is not opened.
logger:
  baud_rate: 0

uart:
  rx_pin: GPIO16
  baud_rate: 4800
  parity: EVEN

status_led:
  pin:
    number: GPIO5
    inverted: true

# What every device has (devices/shared-esphome/README.md), then this one's own.
packages:
  base: !include ../shared-esphome/base.yaml
  wifi: !include ../shared-esphome/wifi-esp32.yaml
  relay: !include {file: ../shared-esphome/relay.yaml, vars: {relay: relay, name: "Relay", default: "false", countdown: "Countdown"}}
  energy: !include {file: ../shared-esphome/energy-totals.yaml, vars: {energy: energy, id_end: "", name_end: ""}}
  # Its relay is rated 16 A: 3680 W at 230 V.
  overload: !include {file: ../shared-esphome/overload.yaml, vars: {relay: relay, power: power, id_end: "", name_end: "", max: "3680", default: "3680"}}
  derived: !include {file: ../shared-esphome/derived-power.yaml, vars: {voltage: voltage, current: current, power: power, id_end: "", name_end: ""}}

switch:
  - id: relay
    platform: gpio
    name: "Relay"
    pin: GPIO13
    on_turn_on:
      - output.turn_on: relay_led
    on_turn_off:
      - output.turn_off: relay_led

output:
  - platform: gpio
    id: relay_led
    pin:
      number: GPIO18
      inverted: true

display:
  platform: tm1621
  id: tm1621_display
  cs_pin: GPIO25
  data_pin: GPIO14
  read_pin: GPIO26
  write_pin: GPIO27
  lambda: |-
    if (id(page).state) {
      it.display_voltage(true);
      it.display_kwh(false);
      it.printf(0, "%.1f", id(voltage).state);
      it.printf(1, "%.1f", id(current).state);
    } else {
      it.display_voltage(false);
      it.display_kwh(true);
      it.printf(0, "%.1f", id(energy).state / 1000.0);
      it.printf(1, "%.1f", id(power).state);
    }

binary_sensor:
  - platform: gpio
    id: button_1
    internal: true
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_click:
      # A short press switches the relay; a longer one, what the display shows.
      - max_length: 350ms
        then:
          - switch.toggle: relay
      - min_length: 360ms
        max_length: 3s
        then:
          - binary_sensor.template.publish:
              id: page
              state: !lambda "return !id(page).state;"
  - platform: template
    id: page
    internal: true
    publish_initial_state: true
sensor:
  - platform: cse7766
    current:
      name: "Current"
      id: current
      filters:
        # Each reading handed to the derived readings, as it comes
        # (devices/shared-esphome/derived-power.yaml): the meter gives current
        # last, after the voltage and power below.
        - lambda: |-
            id(derived_reading).execute(x);
            return x;
        - throttle_average: 1s
    voltage:
      name: "Voltage"
      id: voltage
      filters:
        - lambda: |-
            id(derived_frame)[0] = x;
            return x;
        - throttle_average: 1s
    power:
      name: "Power"
      id: power
      filters:
        - lambda: |-
            id(derived_frame)[1] = x;
            return x;
        - throttle_average: 1s
    energy:
      name: "Energy"
      id: energy
      unit_of_measurement: Wh
      device_class: energy
      state_class: total_increasing
      filters:
        - throttle: 5s

