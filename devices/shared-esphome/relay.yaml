# One relay's own settings, as Sonoff's own firmware offers them: its power-on
# state (off, on, or as it was last switched) and a countdown that switches it
# over. A device's config includes this once for each of its relays, naming
# it in vars:
#
#   relay      the relay switch's id
#   name       its name, which its power-on state's begins with
#   default    its state on a first start, when it has never been switched:
#              "true" or "false"
#   countdown  its countdown's name
#
# The relay is set up doing nothing (restore_mode: DISABLED), so that "Off"
# never sees it switched on, even for a moment, and is switched as the select
# says once both are set up. Its state is saved where ESPHome saves a
# restoring switch's, so a device updated from a build without this keeps it.

esphome:
  on_boot:
    # After the relay and the select (setup_priority::HARDWARE), and a template
    # relay (HARDWARE - 2); before the meter and Wi-Fi.
    - priority: 700
      then:
        - lambda: |-
            // Saved from here on, as RESTORE_DEFAULT_OFF saves it; read as it
            // reads it.
            id(${relay}).set_restore_mode(switch_::SWITCH_RESTORE_DEFAULT_OFF);
            bool on = id(${relay}).get_initial_state().value_or(${default});
            const auto choice = id(${relay}_power_on).current_option();
            if (choice == "On") {
              on = true;
            } else if (choice == "Off") {
              on = false;
            }
            if (on) {
              id(${relay}).turn_on();
            } else {
              id(${relay}).turn_off();
            }

switch:
  - id: !extend ${relay}
    restore_mode: DISABLED
    # Written to flash now, not at the next flash_write_interval: unplugged
    # before then, the device would come back as it was.
    on_turn_on:
      - lambda: global_preferences->sync();
    on_turn_off:
      - lambda: global_preferences->sync();

select:
  - platform: template
    id: ${relay}_power_on
    name: "${name} power-on state"
    icon: mdi:power-settings
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Off"
      - "On"
      - "Last state"
    initial_option: "Last state"
    on_value:
      # The select saves its choice once on_value has run, so the write waits
      # for the next loop.
      - delay: 0s
      - lambda: global_preferences->sync();

number:
  # Seconds until the relay switches over; 0 stops it. Gone at a restart.
  - platform: template
    name: "${countdown}"
    id: ${relay}_countdown
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    min_value: 0
    max_value: 86400
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: false
    mode: box
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'
            then:
              - script.execute: ${relay}_countdown_run
            else:
              - script.stop: ${relay}_countdown_run

script:
  - id: ${relay}_countdown_run
    mode: restart
    then:
      - logger.log:
          format: "${countdown}: switching in %.0f seconds"
          args:
            - id(${relay}_countdown).state
      - delay: !lambda "return id(${relay}_countdown).state * 1000;"
      - switch.toggle: ${relay}
      - number.set:
          id: ${relay}_countdown
          value: 0
      - logger.log: "${countdown} finished: relay switched"
