# ESPHome for the Sonoff TH Elite 20A (THR320D). Not the THR316D, whose
# relay is wired differently.
#
# The conversion tool installs this pre-built (artifacts/README.md says how it
# is built), with no Wi-Fi and no passwords in it: it writes the device's own
# Wi-Fi into the two placeholders in devices/shared-esphome/wifi-esp32.yaml
# (tools/autoflash/imprint.py). What every device has is in
# devices/shared-esphome/, which Home Assistant fetches with this config when it
# adopts the device (dashboard_import) and builds it there.
#
# Its pins are as published (devices/sonoff-th-elite/README.md says where). It has run in
# the emulator only, which has no relay or other hardware to see.

esphome:
  # Named as every firmware the conversion installs is, whatever the device.
  name: esphome
  friendly_name: esphome
  comment: Sonoff-THR320D
  name_add_mac_suffix: true
  project:
    name: liberator.sonoff-th-elite
    version: "2026.10.0-3"
  on_boot:
    # Tasmota holds its output pins through a software restart, and the install
    # ends with one: release them before anything drives them.
    - priority: 1000
      then:
        - lambda: |-
            gpio_hold_dis(GPIO_NUM_19);
            gpio_hold_dis(GPIO_NUM_22);
            gpio_hold_dis(GPIO_NUM_4);
            gpio_hold_dis(GPIO_NUM_13);
            gpio_hold_dis(GPIO_NUM_15);
            gpio_hold_dis(GPIO_NUM_16);

# Adopting the device in Home Assistant's ESPHome builder takes this config as
# a package. update_firmware.py writes the release.
dashboard_import:
  package_import_url: github://adamsthws/firmware-liberator/devices/sonoff-th-elite/esphome.yaml@v3.2.0
  import_full_config: false

esp32:
  variant: esp32
  framework:
    type: esp-idf
  flash_size: 4MB

# The serial port's pins are not the meter's, but its log is of no use on a
# device whose case is not opened.
logger:
  baud_rate: 0

status_led:
  pin:
    number: GPIO15
    inverted: true

# What every device has (devices/shared-esphome/README.md), then this one's own.
packages:
  base: !include ../shared-esphome/base.yaml
  wifi: !include ../shared-esphome/wifi-esp32.yaml
  relay: !include {file: ../shared-esphome/relay.yaml, vars: {relay: relay, name: "Relay", default: "false", countdown: "Countdown"}}

# The main relay latches: a pulse on one pin turns it on, a pulse on the other
# off. Both on together overheats the device within minutes: each is interlocked
# with the other, off at start, and on for half a second at most.
switch:
  - platform: gpio
    id: relay_on_pin
    internal: true
    pin: GPIO19
    restore_mode: ALWAYS_OFF
    interlock: [relay_off_pin]
    interlock_wait_time: 100ms
    on_turn_on:
      - delay: 500ms
      - switch.turn_off: relay_on_pin
  - platform: gpio
    id: relay_off_pin
    internal: true
    pin: GPIO22
    restore_mode: ALWAYS_OFF
    interlock: [relay_on_pin]
    interlock_wait_time: 100ms
    on_turn_on:
      - delay: 500ms
      - switch.turn_off: relay_off_pin
  # It cannot be read back, so this says what it was last told.
  - platform: template
    id: relay
    name: "Relay"
    assumed_state: true
    optimistic: true
    turn_on_action:
      - switch.turn_on: relay_on_pin
      - output.turn_on: relay_led
    turn_off_action:
      - switch.turn_on: relay_off_pin
      - output.turn_off: relay_led
  - platform: gpio
    id: dry_contact
    name: "Dry contact"
    pin: GPIO4
    restore_mode: ALWAYS_OFF
  # Powers the sensor on the RJ9 socket.
  - platform: gpio
    id: sensor_power
    internal: true
    pin: GPIO27
    restore_mode: ALWAYS_ON

output:
  - platform: gpio
    id: relay_led
    pin:
      number: GPIO16
      inverted: true

display:
  platform: tm1621
  id: tm1621_display
  cs_pin: GPIO17
  data_pin: GPIO5
  read_pin: GPIO23
  write_pin: GPIO18
  lambda: |-
    it.printf(0, "%.1f", id(temperature).state);
    it.display_celsius(true);
    it.printf(1, "%.1f", id(humidity).state);
    it.display_humidity(true);

binary_sensor:
  - platform: gpio
    id: button_1
    internal: true
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - switch.toggle: relay

sensor:
  # The Sonoff THS01 on the RJ9 socket.
  - platform: dht
    pin: GPIO25
    model: SI7021
    update_interval: 60s
    temperature:
      name: "Temperature"
      id: temperature
    humidity:
      name: "Humidity"
      id: humidity

